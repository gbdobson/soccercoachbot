version: 1
backend:
  phases:
    build:
      commands:
        - npm install -g @aws-amplify/cli@12
        - npx ampx --version || npx @aws-amplify/cli ampx --version
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - echo "No frontend build step. Serving static index.html."
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
