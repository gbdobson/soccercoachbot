version: 1
backend:
  phases:
    build:
      commands:
        - npm install          # ← Changed from npm ci
frontend:
  phases:
    preBuild:
      commands:
        - npm install          # ← Changed from npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - '**\node_modules/**/*'
